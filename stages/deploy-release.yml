parameters:
- name: PoolType
  type: string
  values:
    - 'VM'
    - 'Pool'
  
- name: PoolName
  type: string

- name: LocalVariables
  type: string

- name: PackageType
  type: string

- name: DependantStage
  type: string

- name: ExtraConditions
  type: boolean
  default: true
  

stages:
- stage: Deploy_${{ parameters.PackageType }}
  displayName: 'Deploy ${{ parameters.PackageType }}'
  dependsOn: ${{ parameters.DependantStage }}
  condition: and( succeeded('${{ parameters.DependantStage }}'), ${{ parameters.ExtraConditions }})
  
  jobs:
  - deployment: 'Deploy${{ parameters.PackageType}}Package'
    displayName: 'Deploy ${{ parameters.PackageType}} Package'

    variables:
    - template: '${{ parameters.LocalVariables }}@self'
    - template: '../variables/versions.yml'
    
    pool:
      ${{ if eq( parameters.PoolType, 'VM' )}}:
        vmImage: ${{ parameters.PoolName }}
      ${{ if eq( parameters.PoolType, 'Pool' )}}:
        name: ${{ parameters.PoolName }}

    environment: '${{ variables.Product }} ${{ parameters.PackageType }} NuGet'
    strategy: 
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            displayName: Download Changelog Artifact
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'changelog'
              downloadPath: '$(build.artifactstagingdirectory)'

          # first because both are cheap and failable and nothing below is: Beta and Release create and delete GitHub
          # releases, and the push at the bottom cannot be un-published on any PackageType. Alpha runs no GitHub step
          # at all, so this is a fail-fast gate for the whole stage rather than a prerequisite of the release steps
          - ${{ if eq( variables.PostTargetToNuGet, 'yes' )}}:
            # pinned, not floated: nuget.exe is whatever the hosted image ships, and its version decides whether the
            # single push below also publishes an adjacent .snupkg, so an image refresh could change what reaches the
            # feed with no commit anywhere. 6.4.0 is the spec the 2026-08-23T04:45 log resolved unpinned, reporting
            # file version 6.4.0.123, so this holds today's behaviour rather than changing it
            # deliberately fatal: a wrong nuget.exe changes publish behaviour quietly, a missing one fails loudly
            - task: NuGetToolInstaller@1
              displayName: 'Pin NuGet CLI to 6.4.0'
              inputs:
                versionSpec: '6.4.0'

            # ahead of the release below rather than beside the push further down: create-github-release.yml globs
            # this folder for its assets, and downloading afterwards attached nothing while still reporting success.
            # it is also what puts any .snupkg beside its .nupkg for the push below, so narrowing this to *.nupkg
            # would stop symbol publication with no error anywhere
            - task: DownloadBuildArtifacts@0
              displayName: 'Download ${{ parameters.PackageType }} Artifact'
              inputs:
                buildType: 'current'
                downloadType: 'single'
                artifactName: '${{ parameters.PackageType}}'
                downloadPath: '$(build.artifactstagingdirectory)'

          - ${{ if eq( parameters.PackageType, 'Beta') }}:
            - template: '../steps/create-github-release.yml'
              parameters: 
                PackageType: ${{ parameters.PackageType }}
                GitHubConnectionName: ${{ variables.GitHubConnectionName }}
                RepositoryName: ${{ variables.RepoName }}
                VersionNumber: ${{ variables.BetaVersion }}
                PostTargetToNuGet: ${{ variables.PostTargetToNuGet }}
                IsPreRelease: true
          
          - ${{ if eq( parameters.PackageType, 'Release') }}:
            - task: GitHubRelease@1
              displayName: 'Delete GitHub Beta Release'
              inputs:
                gitHubConnection: ${{ variables.GitHubConnectionName }}
                repositoryName: '${{ variables.RepoName }}'
                action: 'delete'
                tag: ${{ variables.BetaVersion }}

            - template: '../steps/create-github-release.yml'
              parameters: 
                PackageType: ${{ parameters.PackageType }}
                GitHubConnectionName: ${{ variables.GitHubConnectionName }}
                RepositoryName: ${{ variables.RepoName }}
                VersionNumber: ${{ variables.SemanticVersion }}
                PostTargetToNuGet: ${{ variables.PostTargetToNuGet }}

          # deliberately a second guard rather than a merge with the one above: a NuGet push cannot be un-published,
          # so it has to stay below the GitHub release steps that sit between the two blocks. Merging them would
          # publish before those steps can fail, stranding a version no re-run can replace
          - ${{ if eq( variables.PostTargetToNuGet, 'yes' )}}:
            # one push, symbols included: on 6.4.0 a single push of the .nupkg also pushes the .snupkg beside it,
            # measured not inferred - the 2026-08-23 Push NuGet Alpha Package log shows an unprompted PUT to
            # /symbolpackage/ returning Created. The pin and the co-located download above keep that true
            # unguarded, accepted: the symbol half rides inside this fatal push, so a feed with no symbol endpoint
            # fails it with the .nupkg already public - strands the version. Do not add continueOnError
            - task: NuGetCommand@2
              displayName: 'Push NuGet ${{ parameters.PackageType}} Package'
              inputs:
                command: 'push'
                packagesToPush: '$(build.artifactstagingdirectory)/${{ parameters.PackageType}}/*.nupkg'
                nuGetFeedType: 'external'
                publishFeedCredentials: ${{ variables.NuGetFeedCredentialName }}








