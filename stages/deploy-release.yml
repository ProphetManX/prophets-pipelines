parameters:
- name: PoolType
  type: string
  values:
    - 'VM'
    - 'Pool'
  
- name: PoolName
  type: string

- name: LocalVariables
  type: string

- name: PackageType
  type: string

- name: DependantStage
  type: string

- name: ExtraConditions
  type: boolean
  default: true
  

stages:
- stage: Deploy_${{ parameters.PackageType }}
  displayName: 'Deploy ${{ parameters.PackageType }}'
  dependsOn: ${{ parameters.DependantStage }}
  condition: and( succeeded('${{ parameters.DependantStage }}'), ${{ parameters.ExtraConditions }})
  
  jobs:
  - deployment: 'Deploy${{ parameters.PackageType}}Package'
    displayName: 'Deploy ${{ parameters.PackageType}} Package'

    variables:
    - template: '${{ parameters.LocalVariables }}@self'
    - template: '../variables/versions.yml'
    
    pool:
      ${{ if eq( parameters.PoolType, 'VM' )}}:
        vmImage: ${{ parameters.PoolName }}
      ${{ if eq( parameters.PoolType, 'Pool' )}}:
        name: ${{ parameters.PoolName }}

    environment: '${{ variables.Product }} ${{ parameters.PackageType }} NuGet'
    strategy: 
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            displayName: Download Changelog Artifact
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'changelog'
              downloadPath: '$(build.artifactstagingdirectory)'

          - ${{ if eq( parameters.PackageType, 'Beta') }}:
            - template: '../steps/create-github-release.yml'
              parameters: 
                PackageType: ${{ parameters.PackageType }}
                GitHubConnectionName: ${{ variables.GitHubConnectionName }}
                RepositoryName: ${{ variables.RepoName }}
                VersionNumber: ${{ variables.BetaVersion }}
                PostTargetToNuGet: ${{ variables.PostTargetToNuGet }}
                IsPreRelease: true
          
          - ${{ if eq( parameters.PackageType, 'Release') }}:
            - task: GitHubRelease@1
              displayName: 'Delete GitHub Beta Release'
              inputs:
                gitHubConnection: ${{ variables.GitHubConnectionName }}
                repositoryName: '${{ variables.RepoName }}'
                action: 'delete'
                tag: ${{ variables.BetaVersion }}

            - template: '../steps/create-github-release.yml'
              parameters: 
                PackageType: ${{ parameters.PackageType }}
                GitHubConnectionName: ${{ variables.GitHubConnectionName }}
                RepositoryName: ${{ variables.RepoName }}
                VersionNumber: ${{ variables.SemanticVersion }}
                PostTargetToNuGet: ${{ variables.PostTargetToNuGet }}

          - ${{ if eq( variables.PostTargetToNuGet, 'yes' )}}:
            - task: DownloadBuildArtifacts@0
              displayName: Download Artifact
              inputs:
                buildType: 'current'
                downloadType: 'single'
                artifactName: '${{ parameters.PackageType}}'
                downloadPath: '$(build.artifactstagingdirectory)'
                
            # only a project setting IncludeSymbols produces a .snupkg, so detect one rather than assume it
            # ordered ahead of the package push and non-fatal: detection must never fail a release it cannot un-publish
            - task: PowerShell@2
              displayName: 'Detect ${{ parameters.PackageType}} Symbol Package'
              continueOnError: true
              inputs:
                targetType: 'inline'
                script: |
                  $dir = '$(build.artifactstagingdirectory)/${{ parameters.PackageType}}'
                  # @() so .Count is meaningful for 0, 1, and n
                  $symbols = @(Get-ChildItem -Path $dir -Filter '*.snupkg' -File -ErrorAction SilentlyContinue)
                  Write-Host "Found $($symbols.Count) symbol package(s) in $dir"
                  $found = if($symbols.Count -gt 0){ 'true' } else { 'false' }
                  Write-Host "##vso[task.setvariable variable=HasSymbolPackage]$found"

            - task: NuGetCommand@2
              displayName: 'Push NuGet ${{ parameters.PackageType}} Package'
              inputs:
                command: 'push'
                packagesToPush: '$(build.artifactstagingdirectory)/${{ parameters.PackageType}}/*.nupkg'
                nuGetFeedType: 'external'
                publishFeedCredentials: ${{ variables.NuGetFeedCredentialName }}

            # kept off the package push and non-fatal: nuget.exe may already have pushed this .snupkg alongside
            # the .nupkg, and a feed with no symbol endpoint must not take the release down with it
            - task: NuGetCommand@2
              displayName: 'Push NuGet ${{ parameters.PackageType}} Symbol Package'
              condition: and( succeeded(), eq( variables['HasSymbolPackage'], 'true' ))
              continueOnError: true
              inputs:
                command: 'push'
                packagesToPush: '$(build.artifactstagingdirectory)/${{ parameters.PackageType}}/*.snupkg'
                nuGetFeedType: 'external'
                publishFeedCredentials: ${{ variables.NuGetFeedCredentialName }}








