parameters:
- name: PoolType
  type: string
  values:
    - 'VM'
    - 'Pool'
  
- name: PoolName
  type: string

- name: LocalVariables
  type: string

- name: EnableLinuxTesting
  type: string
  default: 'no'

- name: EnableMacTesting
  type: string
  default: 'no'


stages:
- stage: PullRequest
  displayName: 'PR'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  dependsOn: []

  jobs:
  - job: BuildAndTest
    displayName: 'Build and Run Unit Tests'
    
    variables:
    - template: '${{ parameters.LocalVariables }}@self'
    
    pool:
      ${{ if eq( parameters.PoolType, 'VM' )}}:
        vmImage: ${{ parameters.PoolName }}
      ${{ if eq( parameters.PoolType, 'Pool' )}}:
        name: ${{ parameters.PoolName }}
    
    steps:
    - checkout: self
      submodules: true

    - template: '../steps/restore-build-test.yml'
      parameters:  
        HasSqlProj: ${{ variables.HasSqlProj }}
        LocalTestsOnly: ${{ variables.LocalTestsOnly }}

  - template: '../jobs/os-platform-testing.yml'
    parameters:
      LocalVariables: ${{ parameters.LocalVariables }}
      EnableLinuxTesting: ${{ parameters.EnableLinuxTesting }}
      EnableMacTesting: ${{ parameters.EnableMacTesting }}