parameters:
- name: PoolType
  type: string
  values:
    - 'VM'
    - 'Pool'
  
- name: PoolName
  type: string

- name: LocalVariables
  type: string


stages:
- stage: Build
  displayName: 'CI'
  condition: ne(variables['Build.Reason'], 'PullRequest')
  dependsOn: []

  jobs:
  - job: BuildAndPackage
    displayName: 'Build, Test, and Package'
    
    variables:
    - name: revisionDetails
      value: ''
    - template: '${{ parameters.LocalVariables }}@self'
    - template: '../variables/versions.yml'
    
    pool:
      ${{ if eq( parameters.PoolType, 'VM' )}}:
        vmImage: ${{ parameters.PoolName }}
      ${{ if eq( parameters.PoolType, 'Pool' )}}:
        name: ${{ parameters.PoolName }}
    
    steps:
    - checkout: self
      submodules: true

    - ${{ if ne( variables.TargetProject, '' )}}:
      - task: PowerShell@2
        displayName: "Extract Release Notes from CHANGELOG"
        inputs:
          targetType: 'inline'
          script: |
            if(-not (Test-Path CHANGELOG.md)){
                Write-Host "##vso[task.logissue type=error]CHANGELOG.md was not found at the repository root. It is required whenever TargetProject is set in app-variables.yml."
                exit 1
            }
            # @() so .Count is meaningful for 0, 1, and n
            $changeFile = @(Get-Content CHANGELOG.md)
            if($changeFile.Count -eq 0){
                Write-Host "##vso[task.logissue type=error]CHANGELOG.md is empty, so the release notes would be blank. Add a '# v<version>' section for this build."
                exit 1
            }
            $sb = [System.Text.StringBuilder]::new()
            [void]$sb.AppendLine()
            [void]$sb.AppendLine($changeFile[0])
            for($i = 1; $i -lt $changeFile.Count; $i++){
                if($changeFile[$i].StartsWith("# v")){
                    break
                }
                [void]$sb.AppendLine($changeFile[$i])
            }
            $projName = "${{ variables.TargetProject }}"
            $projName = $projName.Replace("**/", "")
            Write-Host $projName
            $projFile = @((Get-ChildItem -Recurse -File) | where name -eq $projName)
            if($projFile.Count -eq 0){
                Write-Host "##vso[task.logissue type=error]No project file named '$projName' was found in the repository. Correct the TargetProject variable in app-variables.yml."
                exit 1
            }
            if($projFile.Count -gt 1){
                Write-Host "##vso[task.logissue type=error]$($projFile.Count) project files named '$projName' were found ($($projFile.FullName -join '; ')). TargetProject in app-variables.yml must resolve to exactly one project."
                exit 1
            }
            Write-Host $projFile
            [XML]$projXml = Get-Content $projFile[0].FullName
            $notes = $projXml.GetElementsByTagName("PackageReleaseNotes")[0]
            if($null -eq $notes){
                $groups = $projXml.GetElementsByTagName("PropertyGroup")
                if($groups.Count -eq 0){
                    Write-Host "##vso[task.logissue type=error]'$projName' contains no PropertyGroup, so PackageReleaseNotes cannot be added. Confirm TargetProject in app-variables.yml names a valid MSBuild project."
                    exit 1
                }
                $group = $groups[0]
                # msbuild ignores an element stamped with xmlns="", so inherit the namespace of the group it lands in
                $notes = $group.AppendChild($projXml.CreateElement("PackageReleaseNotes", $group.NamespaceURI))
            }
            $notes.InnerText = $sb.ToString()
            $projXml.Save($projFile[0].FullName)

      - task: Assembly-Info-NetCore@3
        displayName: 'Set Assembly Info'
        inputs:
          Path: '$(Build.SourcesDirectory)'
          FileNames: '${{ variables.TargetProject }}'
          InsertAttributes: true
          FileEncoding: 'auto'
          WriteBOM: false
          VersionNumber: '$(SemanticVersion).$(Build.BuildId)'
          FileVersionNumber: '$(SemanticVersion).$(Build.BuildId)'
          InformationalVersion: '$(SemanticVersion)'
          PackageVersion: '$(SemanticVersion)'
          LogLevel: 'verbose'
          FailOnWarning: false
          DisableTelemetry: false

    - template: '../steps/restore-build-test.yml'
      parameters:  
        HasSqlProj: ${{ variables.HasSqlProj }}
        LocalTestsOnly: ${{ variables.LocalTestsOnly }}
    
    - template: '../steps/package-changelog.yml'

    - ${{ if eq( variables.PostTargetToNuGet, 'yes' )}}:
      - template: '../steps/package-artifacts.yml'
        parameters: 
          PackageToPack: ${{ variables.TargetProject }}
          OutputDir: 'Alpha'
          VersionVariable: 'AlphaVersion'

      - template: '../steps/package-artifacts.yml'
        parameters: 
          PackageToPack: ${{ variables.TargetProject }}
          OutputDir: 'Beta'
          VersionVariable: 'BetaVersion'

      - template: '../steps/package-artifacts.yml'
        parameters: 
          PackageToPack: ${{ variables.TargetProject }}
          OutputDir: 'Release'
          VersionVariable: 'SemanticVersion'

