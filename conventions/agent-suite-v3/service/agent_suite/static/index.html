<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ProphetsWay Agent Activity</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">LOCAL · READ-ONLY</p>
      <h1>Agent activity</h1>
      <p class="muted">Last-reported work and evidence, not an agent heartbeat, approval or correctness guarantee.</p>
    </div>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <main>
    <p id="connection" role="status">Connecting to the local journal…</p>
    <section aria-labelledby="runs-heading">
      <h2 id="runs-heading">Runs</h2>
      <div id="runs" class="run-list"></div>
    </section>
    <section id="detail" hidden></section>
  </main>
  <footer>Nothing is sent outside this computer. The dashboard does not start or control agents.</footer>
  <script src="/app.js" defer></script>
</body>
</html>
