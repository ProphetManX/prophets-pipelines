parameters:
- name: HasSqlProj
  type: string
- name: LocalTestsOnly
  type: string
- name: BuildArguments
  type: string
  default: '--configuration Release'
- name: TestArguments
  type: string
  default: '--no-build --configuration Release --filter "Requires!=LocalDb"'

steps:
- ${{ if eq(parameters.HasSqlProj, 'yes')}}:
  - task: NuGetCommand@2
    displayName: 'NuGet restore'
    inputs:
      restoreSolution: '**/*.sqlproj'

  - task: VSBuild@1
    displayName: 'Build Database Projects'
    inputs:
      solution: '**/*.sqlproj'
      configuration: 'Release'

# dotnet core inherintly restores when a build is run
- task: DotNetCoreCLI@2
  displayName: 'Build Solution'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '${{ parameters.BuildArguments }}'

# dotnet test runs each target framework as its own invocation; VSTest could only ever run one
- ${{ if not(eq(parameters.LocalTestsOnly, 'yes')) }}:
  - task: DotNetCoreCLI@2
    displayName: 'Run Unit Tests'
    inputs:
      command: 'test'
      projects: '**/*Test*.csproj'
      arguments: '${{ parameters.TestArguments }}'
      publishTestResults: true